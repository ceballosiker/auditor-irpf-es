name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (SPA + manual, strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- SPA (TypeScript / Vite) ---

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build SPA (Vite)
        run: npm run build

      # --- Manual (MkDocs Material) ---

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install Python dependencies
        run: pip install -r requirements-docs.txt

      - name: Build manual (MkDocs strict)
        run: mkdocs build --strict

      # --- Pages artifact: SPA at root, manual under /manual/ ---
      # `actions/deploy-pages` replaces the entire deployment per upload, so
      # both must ship in a single artefact tree.
      - name: Compose Pages artefact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/manual
          cp -r dist/. public/
          cp -r site/. public/manual/

      - name: Upload Pages artefact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
